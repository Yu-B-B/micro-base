server:
  port: 8401

spring:
  application:
    name: sentinel-server
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    sentinel:
      transport:
        # sentinel dashboard address
        dashboard: localhost:8080
        # 默认8719端口，键入后会自动+1，直到找到未被占用端口
        port: 8719
management:
  endpoint:
    web:
      exposure:
        include: '*'
